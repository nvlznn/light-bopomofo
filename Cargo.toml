[workspace]
resolver = "2"
members = [
    "crates/lightbopomofo-core",
    "crates/lightbopomofo-ffi",
    "crates/lightbopomofo-cli",
    "crates/build-lexicon",
    "crates/lightbopomofo-windows",
    "crates/lightbopomofo-settings",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/nvlznn/light-bopomofo"

# Tests load the full lexicon; keep them fast.
[profile.test]
opt-level = 2

[profile.release]
panic = "unwind"
