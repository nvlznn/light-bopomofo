[package]
name = "lightbopomofo-settings"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "輕注音 for Windows: status and history management (LightBopomofo.exe)"

[[bin]]
name = "LightBopomofo"
path = "src/main.rs"

[dependencies]
lightbopomofo-core = { path = "../lightbopomofo-core" }

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-core = "0.62"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
