<!DOCTYPE html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<style>body{font:13px -apple-system,sans-serif;line-height:1.6}h2{font-size:15px}</style></head>
<body>
<h2>輕注音安裝完成</h2>
<p>在選單列的輸入法選單選擇「<b>輕注音</b>」就可以開始打字。</p>
<p>如果選單裡沒有，請到「系統設定 → 鍵盤 → 輸入方式」按「＋」，在「繁體中文」底下加入「輕注音」。仍然沒有的話，登出再登入一次。</p>
<p>打法：每個字只打第一個注音，例如 ㄋㄏㄇ → 你好嗎。空白鍵送出，← → 選字，Shift + , . / 1 ; 打出 ，。？！：</p>
</body></html>
