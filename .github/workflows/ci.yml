name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch lexicon
        shell: bash
        run: scripts/fetch-lexicon.sh
      - run: cargo test --workspace
      - name: Query speed (optimized, measured alone)
        run: cargo test --release -p lightbopomofo-core --test real_lexicon -- --ignored --test-threads=1

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Composer tests
        run: macos/test.sh
      - name: Universal build and unsigned disk image
        run: macos/build.sh && macos/package-dmg.sh
      - name: Screenshot of the update offer
        continue-on-error: true
        run: |
          mkdir -p screenshots
          LIGHTBOPOMOFO_PRETEND_LATEST=2.0 "macos/build/輕注音.app/Contents/MacOS/LightBopomofo" &
          sleep 12
          # Installing the input method opens System Settings; put the app in front.
          osascript -e 'tell application "System Settings" to quit' || true
          sleep 2
          osascript -e 'tell application "System Events" to set frontmost of (first process whose bundle identifier is "dev.noky.lightbopomofo") to true' || true
          sleep 2
          screencapture -x screenshots/macos-app-update.png
          kill %1 || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-macos
          path: screenshots/
          if-no-files-found: ignore

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Build input method, app and installer
        shell: pwsh
        run: windows/build.ps1
      - name: Type into Notepad through the input method (experimental)
        continue-on-error: true
        shell: pwsh
        run: windows/e2e.ps1
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: screenshots/
          if-no-files-found: ignore
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LightBopomofo-Setup
          path: dist/LightBopomofo-Setup.exe
          if-no-files-found: error
