name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch lexicon
        shell: bash
        run: scripts/fetch-lexicon.sh
      - run: cargo test --workspace

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Composer tests
        run: macos/test.sh
      - name: Universal build and unsigned disk image
        run: macos/build.sh && macos/package-dmg.sh
