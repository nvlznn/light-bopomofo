name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Fetch lexicon
        shell: bash
        run: scripts/fetch-lexicon.sh
      - run: cargo test --workspace
      - name: Query speed (optimized, measured alone)
        run: cargo test --release -p lightbopomofo-core --test real_lexicon -- --ignored --test-threads=1

  macos-shell:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Composer tests
        run: macos/test.sh
      - name: Universal build and unsigned disk image
        run: macos/build.sh && macos/package-dmg.sh

  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc
      - name: Build input method, app and installer
        shell: pwsh
        run: windows/build.ps1
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LightBopomofo-Setup
          path: dist/LightBopomofo-Setup.exe
          if-no-files-found: error
