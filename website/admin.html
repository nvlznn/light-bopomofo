<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>新詞審核</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
:root {
  --bg: #f6f8fb;
  --ink: #1d1d1f;
  --ink2: #4f5663;
  --ink3: #6e7480;
  --line: rgba(20, 30, 50, .08);
  --card: rgba(255, 255, 255, .8);
  --accent: #0066d6;
  --accent-soft: rgba(0, 102, 214, .09);
  --ok: #17803d;
  --no: #b42318;
  --shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 18px 48px rgba(16, 24, 40, .07);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 400 14px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 1100px; margin: 0 auto; padding: 16px 16px 32px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
h1 { font-size: 18px; margin: 0; letter-spacing: .01em; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.btn { border: 0; border-radius: 6px; padding: 5px 9px; background: var(--accent-soft); color: var(--accent); font-weight: 600; cursor: pointer; white-space: nowrap; }
.btn:hover { filter: brightness(.97); }
.btn.primary { background: var(--accent); color: #fff; }
.btn.ok { background: rgba(23, 128, 61, .1); color: var(--ok); }
.btn.no { background: rgba(180, 35, 24, .08); color: var(--no); }
.btn.plain { background: transparent; color: var(--ink2); }
.btn:disabled { opacity: .5; cursor: default; }

#login { max-width: 360px; margin: 12vh auto 0; padding: 28px; }
#login h1 { margin-bottom: 18px; }
#login label { display: block; font-size: 14px; color: var(--ink2); margin: 12px 0 6px; }
#login input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
#login input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#login .btn { width: 100%; margin-top: 20px; padding: 10px; }
.error { color: var(--no); font-size: 14px; min-height: 1.5em; margin: 10px 0 0; }

.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tabs button { border: 0; border-radius: 999px; padding: 5px 10px; background: transparent; color: var(--ink2); cursor: pointer; }
.tabs button[aria-pressed="true"] { background: var(--ink); color: #fff; }
.tabs .n { opacity: .7; margin-left: 4px; font-variant-numeric: tabular-nums; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 13px; color: var(--ink3); font-weight: 500; }
tr:last-child td { border-bottom: 0; }
td.word { font-size: 16px; font-weight: 600; }
td.typed { color: var(--ink2); font-size: 14px; }
td.num { font-variant-numeric: tabular-nums; color: var(--ink2); }
td.act { width: 155px; text-align: right; white-space: nowrap; }
td.act .btn + .btn { margin-left: 6px; }
.empty { padding: 20px; text-align: center; color: var(--ink3); }
tr[data-selected="true"] { background: var(--accent-soft); }
tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.save-state { display: block; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; color: var(--ink3); }
.save-state:empty { display: none; }
[hidden] { display: none !important; }
#review-message:empty { display: none; }
#review-message { margin: 4px 0 8px; }
#shortcuts { margin: 0; font-size: 12px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.toolbar .tabs, .toolbar #filters { margin: 0; }
.save-state.failed { color: var(--no); }
.review-tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
#filters { margin-bottom: 16px; }
#min-uses { width: 65px; padding: 4px 6px; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
kbd { font: inherit; font-weight: 600; }
.muted { color: var(--ink3); font-size: 14px; }

details { margin: 12px 0; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
summary { cursor: pointer; font-weight: 600; }
#dictionary-form label { display: grid; gap: 4px; }
#dictionary-form input { padding: 7px; border: 1px solid var(--line); border-radius: 6px; max-width: 100%; }
#dictionary-reading { width: 250px; }
#dictionary-frequency { width: 100px; }
#dictionary-words { padding-left: 20px; }
#dictionary-words li { margin: 8px 0; }
#sync-devices { overflow-wrap: anywhere; font-size: 12px; color: var(--ink2); }
@media (max-width: 640px) {
  thead { display: none; }
  tr { display: grid; grid-template-columns: 1fr auto; padding: 6px 2px; border-bottom: 1px solid var(--line); }
  tr:last-child { border-bottom: 0; }
  td { border: 0; padding: 4px 10px; }
  td.word { grid-column: 1; }
  td.act { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
  td.typed, td.num { grid-column: 1; font-size: 13px; }
}
</style>
</head>
<body>
<div class="wrap">
  <form id="login" class="card" hidden>
    <h1>新詞審核</h1>
    <label for="email">帳號</label>
    <input id="email" type="email" autocomplete="username" value="ino@noky.dev" required>
    <label for="password">密碼</label>
    <input id="password" type="password" autocomplete="current-password" required>
    <button class="btn primary" type="submit">登入</button>
    <p class="error" id="login-error" role="alert"></p>
  </form>

  <main id="review" hidden>
    <header>
      <h1>新詞審核</h1>
      <button class="btn plain" id="logout" type="button">登出</button>
    </header>
    <div class="toolbar">
    <form id="filters" class="review-tools">
      <label for="min-uses">至少幾次</label>
      <input id="min-uses" type="number" min="1" max="2147483647" step="1" value="2" required title="跨裝置累計；設為 1 顯示全部">
      <button id="apply-filter" class="btn" type="submit">套用</button>

    </form>
    <div class="tabs" role="group" aria-label="狀態">
      <button type="button" data-status="pending" aria-pressed="true">待審<span class="n"></span></button>
      <button type="button" data-status="approved" aria-pressed="false">已核准<span class="n"></span></button>
      <button type="button" data-status="rejected" aria-pressed="false">不要<span class="n"></span></button>
    </div>
    </div>
    <div class="toolbar">
      <p class="muted" id="shortcuts" title="使用英文輸入；已處理的詞只保留上一筆">↑↓ 選詞 · <kbd>A</kbd> 核准 · <kbd>D</kbd> 不要 · <kbd>U</kbd> 撤回</p>
      <button class="btn plain" id="refresh" type="button">重整</button>
    </div>

    <p id="sync-summary" class="muted">尚未收到同步資料</p>
    <details><summary>最近同步的裝置（最多 20 台）</summary><ul id="sync-devices"></ul></details>
    <details id="dictionary-panel">
      <summary>正式詞庫：新增與刪除</summary>
      <p class="muted">入庫後會隨下一版 App 的詞庫提供；不會立即套用到使用者電腦。</p>
      <form id="dictionary-form" class="review-tools">
        <label>詞 <input id="dictionary-text" required maxlength="40"></label>
        <label>完整注音 <input id="dictionary-reading" required placeholder="ㄍㄨㄥˋ ㄨㄢˊ ㄊㄤ"></label>
        <label>詞頻 <input id="dictionary-frequency" type="number" min="1" max="1000000" value="2000" required></label>
        <button class="btn primary" id="dictionary-save" type="submit">加入詞庫</button>
      </form>
      <p id="dictionary-message" role="status" aria-live="polite"></p>
      <button class="btn plain" id="dictionary-refresh" type="button">載入正式詞庫</button>
      <ul id="dictionary-words"></ul>
    </details>
    <p id="review-message" class="muted" role="status" aria-live="polite"></p>
    <div class="card">
      <table aria-describedby="shortcuts">
        <thead><tr><th>詞</th><th>注音</th><th>裝置</th><th>次數</th><th>最近收到</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>沒有詞</div>
    </div>
  </main>
</div>
<script>
(function () {
  var status = 'pending';
  var $ = function (id) { return document.getElementById(id); };

  function api(path, options) {
    return fetch(path, Object.assign({ credentials: 'same-origin', headers: { 'Content-Type': 'application/json' } }, options || {}))
      .then(function (r) {
        if (r.status === 401) { show('login'); var error = new Error('登入已過期，請重新登入'); error.unauthorized = true; throw error; }
        if (!r.ok) return r.json().catch(function () { return {}; }).then(function (b) { throw new Error(b.error || r.statusText); });
        return r.status === 204 ? null : r.json();
      });
  }

  function show(which) {
    $('login').hidden = which !== 'login';
    $('review').hidden = which !== 'review';
    if (which === 'login') $('password').focus();
  }

  function cell(cls, text) {
    var td = document.createElement('td');
    td.className = cls;
    td.textContent = text;
    return td;
  }

  var minUses = 2;
  try {
    var savedMinimum = Number(window.localStorage.getItem('lb-review-min-uses'));
    if (Number.isSafeInteger(savedMinimum) && savedMinimum >= 1 && savedMinimum <= 2147483647) minUses = savedMinimum;
  } catch (_) {}
  $('min-uses').value = minUses;

  var entries = [];
  var counts = {};
  var selected = -1;
  var loading = false;
  var saving = 0;
  var generation = 0;
  var decisionOrder = 0;

  function lastReviewed() {
    return entries.reduce(function (last, entry) {
      return entry.saved && !entry.saving && !entry.error && entry.status !== status && (!last || entry.order > last.order) ? entry : last;
    }, null);
  }

  function updateVisibleRows() {
    var last = lastReviewed();
    entries.forEach(function (entry) {
      entry.row.hidden = !!(entry.saved && !entry.saving && !entry.error && entry.status !== status && entry !== last);
    });
    if (entries[selected] && entries[selected].row.hidden) {
      var index = entries.findIndex(function (entry) { return !entry.row.hidden && entry.status === status; });
      select(index >= 0 ? index : entries.indexOf(last), false);
    }
  }

  function updateControls() {
    document.querySelectorAll('.tabs button').forEach(function (b) {
      b.disabled = saving > 0;
      b.setAttribute('aria-pressed', String(b.dataset.status === status));
      b.querySelector('.n').textContent = counts[b.dataset.status] || 0;
    });
    $('refresh').disabled = loading || saving > 0;
    $('logout').disabled = saving > 0;
    $('min-uses').disabled = saving > 0;
    $('apply-filter').disabled = saving > 0;
  }

  function select(index, focus) {
    if (entries[selected]) {
      entries[selected].row.setAttribute('data-selected', 'false');
      entries[selected].row.tabIndex = -1;
    }
    selected = index;
    if (entries[index]) {
      entries[index].row.setAttribute('data-selected', 'true');
      entries[index].row.tabIndex = 0;
    }
    if (focus && entries[index]) {
      entries[index].row.focus({ preventScroll: true });
      if (entries[index].row.scrollIntoView) entries[index].row.scrollIntoView({ block: 'nearest' });
    }
  }

  function button(label, cls, next, entry) {
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'btn ' + cls;
    b.textContent = label;
    b.disabled = entry.saving || loading;
    b.onclick = function (e) {
      e.stopPropagation();
      decide(entry, next);
    };
    return b;
  }

  function renderActions(entry) {
    var act = entry.actions;
    act.textContent = '';
    if (entry.status === 'pending') {
      act.appendChild(button('核准', 'ok', 'approved', entry));
      act.appendChild(button('不要', 'no', 'rejected', entry));
    } else {
      var label = document.createElement('span');
      label.textContent = entry.status === 'approved' ? '已核准 ' : '不要 ';
      act.appendChild(label);
      act.appendChild(button('撤回', 'plain', 'pending', entry));
    }
    if (entry.status === 'approved') {
      var add = document.createElement('button');
      add.type = 'button'; add.className = 'btn'; add.textContent = '加入詞庫';
      add.disabled = entry.saving || loading;
      add.onclick = function (e) {
        e.stopPropagation();
        $('dictionary-panel').open = true;
        $('dictionary-text').value = entry.word.text;
        $('dictionary-reading').value = '';
        $('dictionary-message').textContent = '請確認完整注音後加入詞庫。';
        $('dictionary-reading').focus();
      };
      act.appendChild(add);
    }
    var remove = document.createElement('button');
    remove.type = 'button'; remove.className = 'btn no'; remove.textContent = '刪除';
    remove.disabled = entry.saving || loading;
    remove.onclick = function (e) { e.stopPropagation(); deleteSubmission(entry); };
    act.appendChild(remove);
    var state = document.createElement('span');
    state.className = 'save-state' + (entry.error ? ' failed' : '');
    state.setAttribute('role', entry.error ? 'alert' : 'status');
    state.textContent = entry.saving ? '儲存中…' : entry.error ? '儲存失敗，請重試' : '';
    if (entry.error) state.title = entry.error;
    act.appendChild(state);
  }

  function decide(entry, next, follow) {
    if (loading || entry.saving || entry.status === next) return;
    var previous = entry.status;
    entry.order = ++decisionOrder;
    entry.status = next;
    entry.saving = true;
    entry.error = '';
    saving++;
    renderActions(entry);
    updateControls();
    // Keep the row in place and let the next decision start immediately.
    var index = entries.indexOf(entry);
    var nextIndex = entries.findIndex(function (w, i) { return i > index && w.status === status && !w.saving; });
    if (nextIndex < 0) nextIndex = entries.findIndex(function (w) { return w.status === status && !w.saving; });
    select(nextIndex < 0 ? index : nextIndex, follow);
    api('/api/admin/words', { method: 'POST', body: JSON.stringify({ text: entry.word.text, status: next }) })
      .then(function () {
        counts[previous] = Math.max(0, (counts[previous] || 0) - 1);
        counts[next] = (counts[next] || 0) + 1;
        entry.saved = true;
      }).catch(function (error) {
        entry.status = previous;
        entry.error = error.message;
      }).finally(function () {
        entry.saving = false;
        saving--;
        renderActions(entry);
        updateVisibleRows();
        updateControls();
      });
  }

  function load() {
    if (saving) return Promise.resolve();
    var request = ++generation;
    var requestedStatus = status;
    loading = true;
    $('review-message').textContent = '載入中…';
    updateControls();
    entries.forEach(renderActions);
    return api('/api/admin/words?status=' + requestedStatus + '&minUses=' + minUses).then(function (data) {
      if (request !== generation) return;
      show('review');
      counts = data.counts;
      $('sync-summary').textContent = data.lastSyncedAt ? '最近成功同步：' + formatTime(data.lastSyncedAt) : '尚未收到同步資料';
      $('sync-devices').textContent = '';
      (data.syncs || []).forEach(function (sync) {
        var item = document.createElement('li');
        item.textContent = sync.device + ' · v' + sync.app + ' · ' + formatTime(sync.last_synced_at);
        $('sync-devices').appendChild(item);
      });
      loading = false;
      var rows = $('rows');
      rows.textContent = '';
      entries = data.words.map(function (w) {
        var tr = document.createElement('tr');
        tr.tabIndex = -1;
        tr.appendChild(cell('word', w.text));
        tr.appendChild(cell('typed', w.typed.join('、')));
        tr.appendChild(cell('num', w.devices));
        tr.appendChild(cell('num', w.uses));
        tr.appendChild(cell('muted', formatTime(w.last_seen)));

        var act = cell('act', '');
        var entry = { word: w, status: w.status || requestedStatus, row: tr, actions: act };
        renderActions(entry);
        tr.onclick = function () { select(entries.indexOf(entry), true); };
        tr.addEventListener('focus', function () { select(entries.indexOf(entry), false); });
        tr.appendChild(act);
        rows.appendChild(tr);
        return entry;
      });
      select(entries.length ? 0 : -1, false);
      $('empty').hidden = entries.length > 0;
      $('review-message').textContent = '';
    }).catch(function (error) {
      if (request === generation) {
        if (!error.unauthorized) show('review');
        $('review-message').textContent = '載入失敗，請重整：' + error.message;
        // Do not apply another tab's actions to rows left from the old tab.
        entries = [];
        $('rows').textContent = '';
        selected = -1;
      }
    }).finally(function () {
      if (request === generation) { loading = false; updateControls(); }
    });
  }

  function formatTime(value) {
    if (!value) return '—';
    var date = new Date(value);
    return isNaN(date.getTime()) ? '—' : date.toLocaleString('zh-TW', { hour12: false });
  }

  function deleteSubmission(entry) {
    if (loading || entry.saving || saving) return;
    if (!window.confirm('刪除「' + entry.word.text + '」的上傳紀錄？之後同步不會重新加入待審；正式詞庫中的詞不受影響。')) return;
    entry.saving = true; saving++;
    renderActions(entry); updateControls();
    api('/api/admin/words', { method: 'DELETE', body: JSON.stringify({ text: entry.word.text }) })
      .then(function () {
        counts[entry.status] = Math.max(0, (counts[entry.status] || 0) - 1);
        entry.row.remove();
        entries = entries.filter(function (e) { return e !== entry; });
        select(entries.length ? 0 : -1, false);
        $('empty').hidden = entries.length > 0;
        $('review-message').textContent = '已刪除上傳紀錄。';
      }).catch(function (error) {
        $('review-message').textContent = '刪除失敗：' + error.message;
      }).finally(function () { entry.saving = false; saving--; renderActions(entry); updateControls(); });
  }

  var dictionaryBusy = false;
  function dictionaryControls(busy) {
    dictionaryBusy = busy;
    $('dictionary-form').querySelectorAll('input, button').forEach(function (el) { el.disabled = busy; });
    $('dictionary-words').querySelectorAll('button').forEach(function (el) { el.disabled = busy; });
    $('dictionary-refresh').disabled = busy;
  }
  function loadDictionary() {
    return api('/api/admin/lexicon').then(function (data) {
      $('dictionary-words').textContent = '';
      data.words.forEach(function (word) {
        var item = document.createElement('li');
        var label = document.createElement('span');
        label.textContent = word.text + ' · ' + word.reading + ' · 詞頻 ' + word.frequency + ' ';
        item.appendChild(label);
        var remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'btn no'; remove.textContent = '刪除詞庫項目';
        remove.onclick = function () {
          if (dictionaryBusy || !window.confirm('從正式詞庫刪除「' + word.text + '」（' + word.reading + '）？變更會隨下次詞庫發布生效。')) return;
          dictionaryControls(true);
          api('/api/admin/lexicon', { method: 'DELETE', body: JSON.stringify(word) })
            .then(function () { item.remove(); $('dictionary-message').textContent = '已刪除，將於下次詞庫發布生效。'; })
            .catch(function (error) { $('dictionary-message').textContent = '刪除失敗：' + error.message; })
            .finally(function () { dictionaryControls(false); });
        };
        item.appendChild(remove); $('dictionary-words').appendChild(item);
      });
    });
  }
  $('dictionary-refresh').onclick = function () {
    if (dictionaryBusy) return;
    dictionaryControls(true);
    loadDictionary().catch(function (error) { $('dictionary-message').textContent = '載入失敗：' + error.message; })
      .finally(function () { dictionaryControls(false); });
  };
  $('dictionary-form').onsubmit = function (event) {
    event.preventDefault();
    if (dictionaryBusy) return;
    var word = { text: $('dictionary-text').value.trim(), reading: $('dictionary-reading').value.trim(), frequency: Number($('dictionary-frequency').value) };
    dictionaryControls(true);
    api('/api/admin/lexicon', { method: 'POST', body: JSON.stringify(word) }).then(function () {
      $('dictionary-message').textContent = '「' + word.text + '」已加入正式詞庫，將隨下一版 App 提供。';
      return loadDictionary().catch(function () { $('dictionary-message').textContent += ' 清單更新失敗，請重新載入。'; });
    }).catch(function (error) { $('dictionary-message').textContent = '加入失敗：' + error.message; })
      .finally(function () { dictionaryControls(false); });
  };

  document.querySelectorAll('.tabs button').forEach(function (b) {
    b.onclick = function () {
      if (saving) return;
      status = b.dataset.status;
      load();
    };
  });
  $('refresh').onclick = load;
  $('filters').onsubmit = function (e) {
    e.preventDefault();
    if (saving) return;
    var value = Number($('min-uses').value);
    if (!Number.isSafeInteger(value) || value < 1 || value > 2147483647) {
      $('review-message').textContent = '請輸入至少 1 次的整數';
      return;
    }
    minUses = value;
    try { window.localStorage.setItem('lb-review-min-uses', String(value)); } catch (_) {}
    load();
  };

  document.addEventListener('keydown', function (e) {
    if ($('review').hidden || loading || e.isComposing || e.keyCode === 229 || e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.target.closest && e.target.closest('input, textarea, select, [contenteditable="true"]')) return;
    var key = e.key.toLowerCase();
    if (key === 'arrowdown' || key === 'arrowup') {
      e.preventDefault();
      var step = key === 'arrowdown' ? 1 : -1;
      var index = selected + step;
      while (index >= 0 && index < entries.length && entries[index].row.hidden) index += step;
      if (index >= 0 && index < entries.length) select(index, true);
      return;
    }
    var entry = entries[selected];
    if (key === 'u' && (!entry || entry.status === 'pending')) entry = lastReviewed();
    if (!entry || entry.saving) return;
    var next = key === 'a' && entry.status === 'pending' ? 'approved'
      : key === 'd' && entry.status === 'pending' ? 'rejected'
      : key === 'u' && entry.status !== 'pending' ? 'pending' : null;
    if (next) { e.preventDefault(); decide(entry, next, true); }
  });

  $('login').onsubmit = function (e) {
    e.preventDefault();
    $('login-error').textContent = '';
    fetch('/api/admin/login', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: $('email').value, password: $('password').value })
    }).then(function (r) {
      if (r.ok) { $('password').value = ''; return load(); }
      return r.json().catch(function () { return {}; }).then(function (b) { $('login-error').textContent = b.error || '無法登入'; });
    }).catch(function () { $('login-error').textContent = '連線失敗，請重試'; });
  };

  $('logout').onclick = function () {
    api('/api/admin/logout', { method: 'POST' }).then(function () { generation++; show('login'); }).catch(function () { $('review-message').textContent = '登出失敗，請重試'; });
  };

  load().catch(function () {});
})();
</script>
</body>
</html>
